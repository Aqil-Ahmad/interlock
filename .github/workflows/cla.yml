name: CLA

# Selling a commercial exception requires the right to sublicense every line in
# the repository, so a contribution merged without that grant cannot be included
# in it. A DCO check is not a substitute: it certifies the right to submit and
# grants no sublicensing right.
#
# `pull_request_target` runs with this repository's token and secrets even for
# pull requests from forks, which is what lets the check write its verdict back.
# It is safe only because nothing here checks out the pull request's code. Adding
# a checkout step would let any fork run arbitrary code with write access to this
# repository.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# The set the action documents as its requirement. `contents: write` commits the
# signature to `cla-signatures`, `pull-requests` and `statuses` write the verdict
# back, and `actions: write` lets it re-run this check when a signature arrives
# after the pull request opened. This is the one workflow here that runs
# third-party code with a token, which is why the action is pinned by digest.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `issue_comment` fires for every comment in the repository, including on
    # issues, where there is no signature to record.
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    steps:
      - name: Check CLA signature
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          # Signatures are committed to a branch of this repository. A pull
          # request cannot forge one: outside contributors have no write access,
          # so only a maintainer merge can change the record.
          branch: cla-signatures
          path-to-signatures: signatures/v1.json
          # The Entity named in CLA.md holds the copyright already and has
          # nothing to grant itself.
          allowlist: Aqil-Ahmad,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >
            Thanks for the contribution. Interlock is dual-licensed (AGPL-3.0-only
            plus commercial terms), so before this can be merged we need your
            agreement to the [CLA](https://github.com/${{ github.repository }}/blob/main/CLA.md).
            You keep the copyright in your work — the agreement grants the right to
            sublicense it. To sign, comment on this PR with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed by all contributors. Thank you.'
