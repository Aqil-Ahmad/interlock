name: CLA

# Selling a commercial exception requires the right to sublicense every line in
# the repository, so a contribution merged without that grant cannot be included
# in it. A DCO check is not a substitute: it certifies the right to submit and
# grants no sublicensing right.
#
# `pull_request_target` runs with this repository's token and secrets even for
# pull requests from forks, which is what lets the check write its verdict back.
# It is safe only because nothing here checks out the pull request's code. Adding
# a checkout step would let any fork run arbitrary code with write access to this
# repository.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: main
          # Signatures live outside this repo so a contributor cannot alter the
          # record of who agreed to what in the same PR that adds their code.
          remote-organization-name: ${{ github.repository_owner }}
          remote-repository-name: interlock-cla
          path-to-signatures: signatures/v1.json
          allowlist: dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >
            Thanks for the contribution. Interlock is dual-licensed (AGPL-3.0-only
            plus commercial terms), so before this can be merged we need your
            agreement to the [CLA](https://github.com/${{ github.repository }}/blob/main/CLA.md).
            You keep the copyright in your work — the agreement grants the right to
            sublicense it. To sign, comment on this PR with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed by all contributors. Thank you.'
